<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Terrain Profiler</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/dark/main.css" />
<script src="https://js.arcgis.com/4.30/"></script>

<style>
  :root {
    --ink: #0b0f0e;
    --panel: #11201c;
    --line: #1f3a32;
    --accent: #d7ff3e;
    --accent-dim: #93b02a;
    --text: #e7f0ec;
    --muted: #7e958c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Archivo", sans-serif;
    background: var(--ink);
    color: var(--text);
    overflow: hidden;
  }

  #viewDiv { position: absolute; inset: 0; }

  .topbar {
    position: absolute; top: 0; left: 0; right: 0;
    z-index: 20;
    display: flex; align-items: center; gap: 18px;
    padding: 16px 22px;
    background: linear-gradient(180deg, rgba(11,15,14,.92) 0%, rgba(11,15,14,0) 100%);
    pointer-events: none;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .mark { font-weight: 800; font-size: 22px; letter-spacing: -.5px; color: var(--text); }
  .brand .mark b { color: var(--accent); }
  .brand .tag {
    font-family: "Spline Sans Mono", monospace;
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted);
  }

  /* 2D / 3D segmented toggle */
  .viewtoggle {
    position: absolute; top: 16px; right: 22px;
    z-index: 21; pointer-events: auto;
    display: flex; padding: 4px;
    background: rgba(17,32,28,.86);
    backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 11px;
  }
  .viewtoggle button {
    cursor: pointer; border: none; background: transparent;
    color: var(--muted); font-family: "Spline Sans Mono", monospace;
    font-size: 13px; font-weight: 600; letter-spacing: 1px;
    padding: 8px 16px; border-radius: 8px; transition: all .18s ease;
  }
  .viewtoggle button.on { background: var(--accent); color: var(--ink); }

  .panel {
    position: absolute; top: 70px; left: 18px;
    z-index: 20; width: 268px;
    background: rgba(17,32,28,.86);
    backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 14px; padding: 18px;
  }
  .panel h2 {
    font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 14px; font-weight: 600;
  }
  .btn {
    display: flex; align-items: center; gap: 10px;
    width: 100%; cursor: pointer;
    padding: 12px 14px; margin-bottom: 9px;
    background: transparent; color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    font-family: "Archivo", sans-serif; font-size: 14px; font-weight: 600;
    transition: all .18s ease;
  }
  .btn:hover { border-color: var(--accent-dim); transform: translateY(-1px); }
  .btn.primary { background: var(--accent); color: var(--ink); border-color: var(--accent); }
  .btn.primary:hover { background: #c4f02a; }
  .btn.primary.active { background: #c4f02a; box-shadow: 0 0 0 3px rgba(215,255,62,.2); }
  .btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  .btn.primary .dot { background: var(--ink); }

  .field { margin-top: 16px; }
  .field label {
    display: block; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
  }
  select {
    width: 100%; padding: 10px 12px;
    background: var(--ink); color: var(--text);
    border: 1px solid var(--line); border-radius: 9px;
    font-family: "Spline Sans Mono", monospace; font-size: 13px; cursor: pointer;
  }

  .hint {
    margin-top: 16px; padding-top: 14px;
    border-top: 1px solid var(--line);
    font-family: "Spline Sans Mono", monospace;
    font-size: 11px; line-height: 1.6; color: var(--muted);
  }
  .hint b { color: var(--accent); font-weight: 600; }

  .dock {
    position: absolute; bottom: 0; left: 0; right: 0;
    z-index: 20;
    background: rgba(11,15,14,.94);
    backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
    transform: translateY(100%);
    transition: transform .35s cubic-bezier(.2,.8,.2,1);
    max-height: 48vh;
  }
  .dock.open { transform: translateY(0); }
  .dock-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 22px; border-bottom: 1px solid var(--line);
  }
  .dock-head .t {
    font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
  }
  .dock-close {
    cursor: pointer; background: none; border: none; color: var(--muted);
    font-size: 20px; line-height: 1; padding: 4px 8px; border-radius: 6px; transition: color .15s;
  }
  .dock-close:hover { color: var(--accent); }
  .profile-host { padding: 4px 10px 12px; height: 240px; }
  /* Let the widget's own root element fill the host without targeting guessed
     internal class names (which vary by SDK build). */
  .profile-host > * { height: 100%; }

  .stats { display: flex; gap: 0; flex-wrap: wrap; padding: 8px 22px 6px; }
  .stat { flex: 1; min-width: 100px; padding: 4px 0; border-right: 1px solid var(--line); }
  .stat:last-child { border-right: none; }
  .stat .v {
    font-family: "Spline Sans Mono", monospace; font-size: 20px; font-weight: 600; color: var(--accent);
  }
  .stat .k {
    font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-top: 2px;
  }

  @media (max-width: 640px) {
    .panel { width: calc(100% - 36px); top: 64px; }
    .dock { max-height: 56vh; }
  }
</style>
</head>
<body>

<div id="viewDiv"></div>

<div class="topbar">
  <div class="brand">
    <span class="mark">TERRAIN<b>&middot;</b>PROFILER</span>
    <span class="tag">elevation along any path</span>
  </div>
</div>

<div class="viewtoggle" id="viewToggle">
  <button id="btn2d" class="on">2D</button>
  <button id="btn3d">3D</button>
</div>

<div class="panel">
  <h2>Draw a Path</h2>
  <button class="btn primary" id="drawBtn"><span class="dot"></span>New line profile</button>
  <button class="btn" id="clearBtn"><span class="dot"></span>Clear</button>

  <div class="field">
    <label for="basemapSel">Basemap</label>
    <select id="basemapSel">
      <option value="satellite">Imagery</option>
      <option value="hybrid">Imagery + Labels</option>
      <option value="topo-vector" selected>Topographic</option>
      <option value="streets-night-vector">Streets (Night)</option>
      <option value="gray-vector">Light Gray</option>
      <option value="dark-gray-vector">Dark Gray</option>
    </select>
  </div>

  <div class="hint">
    Click <b>New line profile</b>, then click points on the map to trace a route. Double-click to finish. Flip <b>2D / 3D</b> any time &mdash; profiling works in both views.
  </div>
</div>

<div class="dock" id="dock">
  <div class="dock-head">
    <span class="t">Elevation Profile</span>
    <button class="dock-close" id="dockClose">&times;</button>
  </div>
  <div class="stats" id="stats">
    <div class="stat"><div class="v" id="sLen">&mdash;</div><div class="k">Distance</div></div>
    <div class="stat"><div class="v" id="sGain">&mdash;</div><div class="k">Gain</div></div>
    <div class="stat"><div class="v" id="sLoss">&mdash;</div><div class="k">Loss</div></div>
    <div class="stat"><div class="v" id="sMin">&mdash;</div><div class="k">Min Elev</div></div>
    <div class="stat"><div class="v" id="sMax">&mdash;</div><div class="k">Max Elev</div></div>
  </div>
  <div class="profile-host" id="profileHost"></div>
</div>

<script>
require([
  "esri/Map",
  "esri/views/MapView",
  "esri/views/SceneView",
  "esri/widgets/ElevationProfile",
  "esri/core/reactiveUtils"
], function (Map, MapView, SceneView, ElevationProfile, reactiveUtils) {

  // One shared map. ground "world-elevation" feeds the ground profile in BOTH views.
  const map = new Map({ basemap: "topo-vector", ground: "world-elevation" });

  const CONTAINER = "viewDiv";
  const start = { center: [-119.5383, 37.8651], zoom: 12 }; // Yosemite

  // Build both views up front; only one holds the container at a time.
  const mapView = new MapView({
    container: CONTAINER, map: map,
    center: start.center, zoom: start.zoom,
    ui: { components: ["zoom", "compass"] }
  });

  const sceneView = new SceneView({
    map: map,
    center: start.center, zoom: start.zoom,
    ui: { components: ["zoom", "compass", "navigation-toggle"] }
  });

  let activeView = mapView;

  // ---- Elevation profile widget (re-pointed at the active view on switch) ----
  function profileConfig(view) {
    return {
      view: view,
      container: "profileHost",
      profiles: [{ type: "ground", color: "#d7ff3e", title: "Ground" }],
      unit: "metric",
      visibleElements: {
        legend: false, clearButton: true, settingsButton: false,
        sketchButton: true, selectButton: false, uniformChartScalingToggle: false
      }
    };
  }

  let elevationProfile = new ElevationProfile(profileConfig(activeView));
  let vm = elevationProfile.viewModel;

  const dock = document.getElementById("dock");
  const drawBtn = document.getElementById("drawBtn");

  function setStat(id, val) { document.getElementById(id).textContent = val; }
  function resetStats() {
    ["sLen","sGain","sLoss","sMin","sMax"].forEach(function (id) { setStat(id, "\u2014"); });
  }

  // Compute everything directly from the samples array (documented + reliable).
  // Each sample has { distance (m, along-line), elevation (m) }.
  function updateStats() {
    const ground = vm.profiles.find(function (p) { return p.type === "ground"; });
    if (!ground || !ground.samples || !ground.samples.length) { resetStats(); return; }

    // Sort a shallow copy by distance so gain/loss accumulate in path order,
    // regardless of the order the widget populated the array.
    const s = ground.samples
      .filter(function (x) { return x && x.elevation != null && x.distance != null; })
      .slice()
      .sort(function (a, b) { return a.distance - b.distance; });

    if (!s.length) { resetStats(); return; }

    let gain = 0, loss = 0, prev = null;
    let min = Infinity, max = -Infinity, maxDist = 0;
    for (const samp of s) {
      const e = samp.elevation;
      if (e < min) min = e;
      if (e > max) max = e;
      if (samp.distance > maxDist) maxDist = samp.distance;   // furthest point along line
      if (prev != null) { const d = e - prev; if (d > 0) gain += d; else loss -= d; }
      prev = e;
    }

    const distKm = maxDist / 1000;
    setStat("sLen", distKm < 1 ? Math.round(maxDist) + " m" : distKm.toFixed(2) + " km");
    setStat("sGain", Math.round(gain) + " m");
    setStat("sLoss", Math.round(loss) + " m");
    setStat("sMin", isFinite(min) ? Math.round(min) + " m" : "\u2014");
    setStat("sMax", isFinite(max) ? Math.round(max) + " m" : "\u2014");
  }

  // Watchers are re-bound whenever the widget is rebuilt for a new view.
  let progHandle = null, stateHandle = null;
  function bindWatchers() {
    if (progHandle) { progHandle.remove(); }
    if (stateHandle) { stateHandle.remove(); }

    // progress goes 0 -> 1 as the widget samples the ground. Only read stats
    // once it reaches 1, otherwise distance/min/max are half-computed.
    progHandle = reactiveUtils.watch(
      function () { return vm.progress; },
      function (p) { if (p >= 1) { updateStats(); } }
    );

    // Correct viewModel states: disabled | ready | creating | created | selecting | selected
    stateHandle = reactiveUtils.watch(
      function () { return vm.state; },
      function (state) {
        if (state === "creating" || state === "created" || state === "selected") {
          dock.classList.add("open");
        }
        if (state === "created" || state === "selected") {
          drawBtn.classList.remove("active");
          // statistics may settle a beat after state flips; recompute shortly after.
          setTimeout(updateStats, 400);
        }
        if (state === "ready") {
          drawBtn.classList.remove("active");
        }
      }
    );
  }
  bindWatchers();

  // ---- Draw / clear ----
  // Open the dock immediately so the chart host has real height the moment the
  // widget renders into it (a translated/hidden host measures as 0 and the chart
  // canvas never sizes — the cause of the "chart sometimes blank" behaviour).
  dock.classList.add("open");

  drawBtn.addEventListener("click", function () {
    dock.classList.add("open");
    drawBtn.classList.add("active");
    if (typeof vm.start === "function") { vm.start(); }
  });

  document.getElementById("clearBtn").addEventListener("click", function () {
    if (typeof vm.clear === "function") { vm.clear(); }
    dock.classList.remove("open");
    drawBtn.classList.remove("active");
    resetStats();
  });

  document.getElementById("dockClose").addEventListener("click", function () {
    dock.classList.remove("open");
  });

  document.getElementById("basemapSel").addEventListener("change", function (e) {
    map.basemap = e.target.value;
  });

  // ---- 2D / 3D switch via container reassignment ----
  const btn2d = document.getElementById("btn2d");
  const btn3d = document.getElementById("btn3d");

  function switchTo(target) {
    if (target === activeView) return;

    // Preserve the drawn profile geometry across the view swap.
    const savedInput = elevationProfile.input || (vm ? vm.input : null);

    // Carry the camera/extent across.
    const vp = activeView.viewpoint ? activeView.viewpoint.clone() : null;

    // Detach current view from the DOM container.
    activeView.container = null;

    // Destroy the widget bound to the old view and rebuild on the new one.
    elevationProfile.destroy();

    activeView = target;
    if (vp) {
      // Adjust scale for Web Mercator distortion when moving between projections.
      try {
        const lat = vp.targetGeometry && vp.targetGeometry.latitude ? vp.targetGeometry.latitude : 0;
        const factor = Math.cos((lat * Math.PI) / 180) || 1;
        if (activeView.type === "3d") { vp.scale = vp.scale / factor; }
        else { vp.scale = vp.scale * factor; }
      } catch (e) { /* ignore */ }
      activeView.viewpoint = vp;
    }
    activeView.container = CONTAINER;

    elevationProfile = new ElevationProfile(profileConfig(activeView));
    vm = elevationProfile.viewModel;
    bindWatchers();

    // Re-apply the previously drawn line so the profile persists across views.
    if (savedInput) {
      elevationProfile.input = savedInput;
      dock.classList.add("open");
      setTimeout(updateStats, 600);
    } else {
      resetStats();
    }

    const is3D = activeView.type === "3d";
    btn3d.classList.toggle("on", is3D);
    btn2d.classList.toggle("on", !is3D);
  }

  btn2d.addEventListener("click", function () { switchTo(mapView); });
  btn3d.addEventListener("click", function () { switchTo(sceneView); });
});
</script>
</body>
</html>
